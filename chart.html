<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">


</head>

<body>
    <div class="container-fluid">

        <div class="row">

            <div class="col-12 col-md-6">

                <table class="table table-sm table-hover table-striped table-bordered">

                    <tr>
                        <th>Descrição</th>
                        <th>Sparkline</th>
                    </tr>


                    <tr>
                        <td>inlinesparkline</td>
                        <td><span class="inlinesparkline">1,2,4,5,5,1,5</span></td>
                    </tr>

                    <tr>
                        <td>dynamicsparkline</td>
                        <td><span class="dynamicsparkline">A carregar…</span></td>
                    </tr>

                    <tr>
                        <td>dynamicbar</td>
                        <td><span class="dynamicbar">A carregar…</span></td>
                    </tr>

                    <tr>
                        <td>inlinebar</td>
                        <td><span class="inlinebar">1,3,4,5,3,5</span></td>
                    </tr>

                    <tr>
                        <td>dsChart</td>
                        <td><span class="dsChart">A carregar…</span></td>
                    </tr>







                </table>
            </div>
        </div>


    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
        crossorigin="anonymous"></script>


    <script src="https://code.jquery.com/jquery-3.6.2.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-csv/1.0.21/jquery.csv.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-sparklines/2.1.2/jquery.sparkline.min.js"></script>

    <script>
        $(function () {
            $('.inlinesparkline').sparkline();

            const myvalues = [10, 8, 5, 7, 4, 4, 1];

            $('.dynamicsparkline').sparkline(myvalues);

            $('.dynamicbar').sparkline(myvalues, {
                type: 'bar',
                barColor: 'green'
            });



            $.ajax({
                url: 'dataset.csv',
                dataType: 'text',

                success: function (response) {
                    const linhas = $.csv.toArrays(response);

                    // Se o CSV tiver uma linha de cabeçalho, use linhas.slice(1).
                    const linhasDeDados = linhas;

                    const vendas = linhasDeDados.map(function (linha) {
                        return linha.map(Number);
                    });

                    console.table(vendas);

                    $('.dsChart').sparkline(vendas, {
                        type: 'bar',
                        stackedBarColor: ['#f44336', '#2196f3']
                    });
                },

                error: function () {
                    $('.dsChart').text('Não foi possível carregar dataset.csv.');
                }
            });


        });
    </script>

</body>

</html>
